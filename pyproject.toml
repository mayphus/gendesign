[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gendesign"
version = "0.1.0"
description = "Generative-design toolkit for physical parts: requirements, optimization, and a measured print."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mayphus" }]
keywords = [
    "generative-design",
    "topology-optimization",
    "3d-printing",
    "lattices",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "trimesh>=4.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parts = [
    "cadquery==2.8.0",
    "fast-simplification>=0.1",
    "pyvista>=0.43",
]
bayes = ["optuna>=3.0"]

[project.scripts]
gendesign = "gendesign.__main__:main"

[project.urls]
Homepage = "https://github.com/mayphus/gendesign"
Repository = "https://github.com/mayphus/gendesign"

[tool.setuptools.packages.find]
include = ["gendesign*"]
