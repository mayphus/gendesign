name: drybox-adapter
units: mm
purpose: >
  A small grommet adapter that holds a PTFE bowden insert in a filament-dryer
  wall: flared mouth, pocket, 45° cone floor (no flat ledge over air), barbed stem.

constraints:
  pocket_mm: 8.85          # v9 default; tune to the measured insert
  print_hole_undersize_mm: [0.1, 0.2]   # typical FDM shrinkage of printed holes
  cone_floor_deg: 45
  through_bore_mm: 2.6

objectives:
  - press-fit or barb into the dryer-wall hole
  - let the PTFE insert seat and release without a hidden ledge
  - keep the part small; 100% infill is recommended

notes:
  - This is a fit problem. Prefer a pocket-size sweep plus a printed test coupon
    over topology optimization.
  - A drawn pocket equal to the measured pin often will not accept it.
