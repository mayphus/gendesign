name: hair-catcher
units: mm
purpose: >
  Press-fit washbasin drain insert. AI + generative design: the agent
  reviews renders and scores and redirects the next round; the code
  searches a Voronoi density field. Smooth v2 is the hand-tuned
  reference (struts 1.8 mm, ball 8.6 mm, open area 50.54%, volume
  4304 mm3), not the search.

fit:
  drain_id_measured_mm: 35.0          # open hole; measure yours
  collar_od_print_mm: 35.10           # as-printed press-fit target
  shrink: 0.003                       # 0.3% PLA shrinkage allowance
  collar_wall_mm: 1.6
  flange_diameter_mm: 46.0            # seat was assumed, not measured
  flange_thickness_mm: 1.6
  lead_in_mm: 0.7                     # 45° chamfer
  collar_engagement_mm: 10.2          # press-fit skirt, same as smooth v2

constraints:
  max_ball_mm: 12.0                   # hard cap; anything larger must not pass
  min_strut_mm: 1.25                  # search floor; 1.2 mm is the print floor
  min_rim_mm: 1.35
  max_insert_mm: 18.0
  max_proud_mm: 2.5
  max_overhang_deg: 45.0              # flange on the bed, no supports
  cone_angle_deg: 47.0                # from horizontal; 2° margin so facets stay under 45°
  film_gap_mm: 2.7                    # capillary length of water; smaller cells do not drain
  film_full_mm: 4.0                   # full orifice credit. Voronoi B used about 3.5 mm.
  max_fingertip_disp_mm: 1.5
  fingertip_N: 10.0
  hard_push_N: 30.0

objectives:
  drainage: maximize film-weighted orifice flow at a fixed head
  capture: maximize (ball limit minus the largest opening)
  stiffness: maximize fingertip load over peak grillage deflection
  material: minimize solid volume; a print-time proxy follows the volume

reference_smooth_v2:
  max_ball_mm: 8.6
  min_strut_mm: 1.8
  open_area_pct: 50.54
  volume_mm3: 4304.4

physics:
  cd: 0.61
  head_mm: 5.0
  E_MPa: 2340
  nu: 0.36
  flow_proxy_mm3_s: 8.0
  layer_h_mm: 0.20
  layer_overhead_s: 1.5

# Voronoi A (printed 2026-11-12) held water in cells near 1 mm.
# Do not score an opening that small as drainage.
preferred_method: generative
